services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    command: "npm run dev"
    container_name: si-express-api
    ports:
      - "3000:3000"
    networks:
      - si-network
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    command: "npm run dev"
    container_name: si-react-api
    ports:
      - "5173:5173"
    networks:
      - si-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  si-network:
    driver: bridge
  
volumes:
  pstgres_data: